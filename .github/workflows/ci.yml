name: CI

on:
  pull_request:
    types:
      - synchronize
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  lint-test-build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build ./cmd/luxmed-watcher

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize Docker image tag
        if: github.event_name == 'push'
        id: docker_tag
        shell: bash
        run: |
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')"
          if [ "$branch" = "master" ]; then
            tag="latest"
          else
            tag="$(echo "$branch" | sed -E -e 's#[^a-z0-9._-]+#-#g' -e 's#^-+##' -e 's#-+$##')"
          fi
          echo "image=ghcr.io/${repo}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && steps.docker_tag.outputs.image || 'luxmed-watcher:ci' }}
