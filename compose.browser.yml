services:
  luxmed-watcher:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      LUXMED_BROWSER_API_URL: http://browser:8091
      LUXMED_VIEWER_URL: ${LUXMED_VIEWER_URL:-http://localhost:18769}
    volumes:
      - watcher-data:/app/data
    depends_on:
      - browser

  browser:
    build: ./tools/browser-session
    init: true
    restart: unless-stopped
    hostname: luxmed-browser
    environment:
      LUXMED_VIEWER_URL: ${LUXMED_VIEWER_URL:-http://localhost:18769}
    ports:
      - "127.0.0.1:18769:8092"
    volumes:
      - chrome-profile:/profile
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/homelab/chromium-seccomp.json
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    shm_size: 512mb

volumes:
  watcher-data:
  chrome-profile:
