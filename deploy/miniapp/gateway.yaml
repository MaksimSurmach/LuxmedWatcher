apiVersion: v1
kind: Service
metadata:
  name: luxmed-miniapp-home
  namespace: apps
spec:
  ports:
    - name: http
      port: 80
      targetPort: 19090
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: luxmed-miniapp-home-wireguard
  namespace: apps
  labels:
    kubernetes.io/service-name: luxmed-miniapp-home
    endpointslice.kubernetes.io/managed-by: luxmed-watcher
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 19090
endpoints:
  - addresses: [10.250.183.2]
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: luxmed-miniapp
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [luxmed.ranus.site]
      secretName: cloudflare-origin-tls
  rules:
    - host: luxmed.ranus.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: luxmed-miniapp-home
                port: {number: 80}
