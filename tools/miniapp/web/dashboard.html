<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6f5ef">
  <title>Luxmed Watcher</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <script type="module" src="/dashboard.js"></script>
</head>
<body>
  <div class="shell">
    <header class="brand"><span class="brand-icon" data-icon="calendar"></span><span>Luxmed Watcher</span></header>
    <main id="main" tabindex="-1"><h1>Поиски</h1><p>Загружаем приложение…</p></main>
    <nav id="navigation" aria-label="Разделы приложения" hidden>
      <button type="button" data-tab="watches"><span data-icon="calendar"></span>Поиски</button>
      <button type="button" data-tab="history"><span data-icon="history"></span>Найденное</button>
      <button type="button" data-tab="settings"><span data-icon="settings"></span>Настройки</button>
    </nav>
    <div id="announcement" role="status" aria-live="polite"></div>
  </div>
  <noscript>Для приложения нужен JavaScript.</noscript>
</body>
</html>
