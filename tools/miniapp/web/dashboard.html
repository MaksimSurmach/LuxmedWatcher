<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#faf8f4">
  <title>Luxmed Watcher</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <script type="module" src="/dashboard.js"></script>
</head>
<body>
  <div class="shell">
    <header class="brand"><span class="brand-icon" data-icon="calendar"></span><span>Luxmed Watcher</span></header>
    <main id="main" tabindex="-1"><h1>Start</h1><p>Wczytywanie aplikacji…</p></main>
    <nav id="navigation" aria-label="Sekcje aplikacji" hidden>
      <button type="button" data-tab="home"><span data-icon="home"></span><span>Start</span></button>
      <button type="button" data-tab="watches"><span data-icon="calendar"></span><span>Wyszukiwania</span></button>
      <button type="button" data-tab="history"><span data-icon="history"></span><span>Wyniki</span></button>
      <button type="button" data-tab="settings"><span data-icon="settings"></span><span>Ustawienia</span></button>
    </nav>
    <div id="announcement" role="status" aria-live="polite"></div>
  </div>
  <noscript>Aplikacja wymaga JavaScriptu.</noscript>
</body>
</html>
