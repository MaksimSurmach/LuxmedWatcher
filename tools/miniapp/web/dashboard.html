<!doctype html>
<html lang="{{.Locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11141c" media="(prefers-color-scheme: dark)">
  <title>Luxmed Watcher</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <script type="module" src="/boot.js"></script>
</head>
<body>
  <div class="shell">
    <section id="boot" data-entry="dashboard" data-boot-error="{{.Unavailable}}">
      <p role="status">{{.Loading}}</p>
      <a href="">{{.Retry}}</a>
    </section>
    <nav id="navigation" hidden>
      <div class="switch">
        <button type="button" data-tab="history"><span></span><span class="count" data-count="history"></span></button>
        <button type="button" data-tab="watches"><span></span><span class="count" data-count="watches"></span></button>
      </div>
      <button type="button" class="me" data-tab="settings"><span data-icon="user"></span></button>
    </nav>
    <main id="main" tabindex="-1"></main>
    <div id="announcement" role="status" aria-live="polite"></div>
  </div>
  <dialog id="booking" aria-labelledby="booking-title">
    <h2 id="booking-title"></h2>
    <dl class="booking-facts"></dl>
    <p class="muted note" id="booking-note"></p>
    <div class="stack">
      <button type="button" class="primary" id="booking-open">x <span data-icon="link"></span></button>
      <button type="button" class="secondary" id="booking-cancel"></button>
    </div>
  </dialog>
  <noscript>{{.JavaScript}}</noscript>
</body>
</html>
