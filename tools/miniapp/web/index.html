<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="referrer" content="no-referrer">
  <title>Logowanie do LUX MED</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 id="title">Zaloguj się do LUX MED</h1>
        <p id="status" role="status" aria-live="polite">Łączenie…</p>
      </div>
      <button id="close" type="button">Zamknij</button>
    </header>
    <div id="screen" role="region" aria-label="Okno LUX MED"></div>
    <div id="controls" hidden>
      <button id="keyboard" type="button" aria-expanded="false" aria-controls="typing">Klawiatura</button>
      <button id="zoom" type="button" aria-pressed="false">Powiększ</button>
      <button id="scroll-up" type="button" data-scroll="-3" aria-label="Przewiń stronę w górę">↑</button>
      <button id="scroll-down" type="button" data-scroll="3" aria-label="Przewiń stronę w dół">↓</button>
    </div>
    <div id="typing" hidden>
      <label id="keyboardLabel" for="keys">Dotknij pola w LUX MED, a następnie pisz tutaj.</label>
      <input id="keys" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
      <div id="remote-keys">
        <button type="button" data-key="Tab" id="tab-key">Tab</button>
        <button type="button" data-key="Backspace" id="backspace">Usuń</button>
        <button type="button" data-key="Enter" id="enter-key">Enter</button>
      </div>
    </div>
    <noscript>Okno LUX MED wymaga JavaScriptu.</noscript>
  </main>
</body>
</html>
