<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="referrer" content="no-referrer">
  <title>LuxMed — sign in</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 id="title">Sign in to LuxMed</h1>
        <p id="status" role="status" aria-live="polite">Connecting…</p>
      </div>
      <button id="close" type="button">Close</button>
    </header>
    <div id="screen" role="region" aria-label="LuxMed browser"></div>
    <div id="controls" hidden>
      <button id="keyboard" type="button" aria-expanded="false" aria-controls="typing">Keyboard</button>
      <button id="zoom" type="button" aria-pressed="false">Zoom in</button>
    </div>
    <div id="typing" hidden>
      <label id="keyboardLabel" for="keys">Tap a field in LuxMed, then type here.</label>
      <input id="keys" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
      <div id="remote-keys">
        <button type="button" data-key="Tab">Tab</button>
        <button type="button" data-key="Backspace" id="backspace">Backspace</button>
        <button type="button" data-key="Enter">Enter</button>
      </div>
    </div>
    <noscript>JavaScript is required to open the LuxMed browser.</noscript>
  </main>
</body>
</html>
