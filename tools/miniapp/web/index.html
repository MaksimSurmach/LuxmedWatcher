<!doctype html>
<html lang="{{.Locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>LUX MED</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <script type="module" src="/boot.js"></script>
</head>
<body>
  <main>
    <section id="boot" data-entry="app" data-boot-error="{{.Unavailable}}">
      <p role="status">{{.Loading}}</p>
      <a href="">{{.Retry}}</a>
    </section>
    <header>
      <div>
        <h1 id="title"></h1>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
      <button id="close" type="button" hidden></button>
    </header>
    <button id="retry" class="primary" type="button" hidden></button>
    <div id="screen" hidden role="region"></div>
    <div id="controls" hidden>
      <button id="keyboard" type="button" aria-expanded="false" aria-controls="typing"></button>
      <button id="paste" type="button"></button>
      <button id="zoom" type="button" aria-pressed="false"></button>
      <span class="scroll">
        <button id="scroll-up" type="button" data-scroll="-3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button id="scroll-down" type="button" data-scroll="3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      </span>
    </div>
    <p class="hint" id="hint" role="status"></p>
    <div id="typing" hidden>
      <label id="keyboardLabel" for="keys"></label>
      <input id="keys" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
      <div id="remote-keys">
        <button type="button" data-key="Tab" id="tab-key"></button>
        <button type="button" data-key="Backspace" id="backspace"></button>
        <button type="button" data-key="Enter" id="enter-key"></button>
      </div>
    </div>
    <noscript>{{.JavaScript}}</noscript>
  </main>
</body>
</html>
