<!doctype html>
<html lang="{{lang}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="color-scheme" content="light dark">
<style>
/* Same Ticket Wallet palette as the Mini App: warm paper, white stock, navy ink. */
:root {
  color-scheme: light dark;
  --paper: #f3f1ec; --stock: #ffffff; --ink: #1f2f57; --muted: #5f6884; --perf: #d7dbe5; --line: #c9cfdc; --act: #1f2f57; --act-ink: #ffffff;
  --shadow: 0 1px 2px rgb(31 47 87 / .06), 0 6px 18px rgb(31 47 87 / .07);
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #11141c; --stock: #1a1f2c; --ink: #dfe5f5; --muted: #98a1b8; --perf: #2b3245; --line: #3a4258; --act: #dfe5f5; --act-ink: #11141c;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 22px rgb(0 0 0 / .25); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
#status { display: flex; align-items: flex-start; gap: 8px; min-width: 0; color: var(--muted); font-size: .92rem; }
#status::before { content: ''; width: 8px; height: 8px; flex: none; margin-top: .45em; border-radius: 50%; background: currentColor; }
button { flex: none; white-space: nowrap; min-height: 44px; padding: 8px 18px; border: 1px solid var(--act); border-radius: 12px; background: var(--act); color: var(--act-ink); font: inherit; font-weight: 650; cursor: pointer; }
button:disabled { border-color: var(--line); background: transparent; color: var(--ink); opacity: .6; cursor: default; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* Until the remote screen arrives, the card holds an unprinted coupon instead of a blank slab. */
#screen:empty { display: grid; place-items: center; }
#screen:empty::after { content: ''; width: 96px; height: 72px; border: 2px dashed var(--perf); border-radius: 12px; }
#screen { height: calc(100dvh - 84px); margin: 0 16px 16px; overflow: hidden; border-radius: 14px; background: var(--stock); box-shadow: var(--shadow); }
</style>
<header><span id="status" role="status">{{loading}}</span><button id="done" disabled>{{close}}</button></header>
<div id="screen"></div>
<script type="module" src="/viewer.mjs"></script>
</html>
