<!doctype html>
<html lang="{{lang}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
body { margin: 0; background: #151a20; color: white; font: 16px system-ui; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; }
button { font: inherit; padding: 8px 14px; cursor: pointer; }
#screen { height: calc(100dvh - 64px); }
</style>
<header><span id="status" role="status">{{loading}}</span><button id="done" disabled>{{close}}</button></header>
<div id="screen"></div>
<script type="module" src="/viewer.mjs"></script>
</html>
